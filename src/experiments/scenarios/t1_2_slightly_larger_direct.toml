scenario_version = 1
id = "T1.2"
tier = 1
category = "smoke"
name = "Slightly larger preset, still direct"
description = "Three processes on two cores. Fits in six qubits and should stay on the default path."

[workload]
mode = "preset"
num_processes = 3
num_cores = 2
weights = [0.2, 0.5, 0.3]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
qaoa_feasible = true
brute_force_feasible = true
expected_messages = ["feasible output from all solvers"]
