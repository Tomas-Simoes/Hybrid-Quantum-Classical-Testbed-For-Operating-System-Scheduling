scenario_version = 1
id = "E3A"
tier = 7
category = "phase4_top_k_generalization"
name = "Top-k extremes across adversarial workloads"
description = "Adds top_k=1 and top_k=5 for the nine dominant and near-equal workloads; E1 supplies top_k=3 and 10 at p=2."

[workload]
mode = "preset"
num_processes = 6
num_cores = 2
weights = [0.08, 0.08, 0.08, 0.08, 0.08, 0.60]

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.1
top_k = 1
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5
init_strategy = "random"
random_seed = 101

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[validation]
always_run_annealing = true

[execution]
pipeline = "iterative"
visualization = false
repeats = 1

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "load_imbalance", "component_timings_ms"]

[[sweep.cases]]
name = "dominant_060"
