scenario_version = 1
id = "E6R"
tier = 9
category = "phase5_extreme_decomposition_scalability"
name = "Corrected extreme scalability — remaining runs"

[workload]
mode = "generated"
num_processes = 750
num_cores = 2
weight_strategy = "uniform_random"
min_weight = 0.0
max_weight = 1.0
instance_seed = 1

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.1
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5
init_strategy = "random"
random_seed = 10001

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 8
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[validation]
method = "simulated_annealing"
annealing_sweeps = 1000
annealing_restarts = 10
annealing_seed = 1
optimality_rtol = 1e-9
optimality_atol = 1e-9

[execution]
pipeline = "iterative"
visualization = false
repeats = 1

[[sweep.cases]]
name = "n750_seed1"
values = { "workload.num_processes" = 750, "workload.instance_seed" = 1, "qaoa.random_seed" = 10001, "validation.annealing_seed" = 1 }

[[sweep.cases]]
name = "n750_seed2"
values = { "workload.num_processes" = 750, "workload.instance_seed" = 2, "qaoa.random_seed" = 10002, "validation.annealing_seed" = 2 }

[[sweep.cases]]
name = "n1000_seed0"
values = { "workload.num_processes" = 1000, "workload.instance_seed" = 0, "qaoa.random_seed" = 10000, "validation.annealing_seed" = 0 }

[[sweep.cases]]
name = "n1000_seed1"
values = { "workload.num_processes" = 1000, "workload.instance_seed" = 1, "qaoa.random_seed" = 10001, "validation.annealing_seed" = 1 }

[[sweep.cases]]
name = "n1000_seed2"
values = { "workload.num_processes" = 1000, "workload.instance_seed" = 2, "qaoa.random_seed" = 10002, "validation.annealing_seed" = 2 }

[checks]
no_crash = true
global_assignment_feasible = true
