scenario_version = 1
id = "T3.1"
tier = 3
category = "decomposition"
name = "Force decomposition, minimal"
description = "Four processes on two cores require eight qubits, so qubit_max six should force the iterative sub-QUBO path."

[workload]
mode = "preset"
num_processes = 4
num_cores = 2
weights = [0.1, 0.9, 0.4, 0.6]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "iterative"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
global_assignment_feasible = true
global_energy_reported = true
subqubo_path_used = true
