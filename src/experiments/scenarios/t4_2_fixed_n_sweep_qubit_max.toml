scenario_version = 1
id = "T4.2"
tier = 4
category = "scaling"
name = "Fixed N=6, sweep qubit_max"
description = "Control decomposition aggressiveness by sweeping qubit_max for the same six-process workload."

[workload]
mode = "preset"
num_processes = 6
num_cores = 2
weights = [0.2, 0.3, 0.15, 0.35, 0.1, 0.4]

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "auto"
solvers = ["qaoa", "brute_force"]
repeats = 5

[[sweep.axes]]
name = "qubit_max"
path = "decomposition.qubit_max"
values = [6, 8, 10, 12]

[record]
metrics = ["global_energy", "global_feasibility_rate", "solve_time_ms"]

[checks]
no_crash = true
global_assignment_feasible = true
expected_trend = "larger qubit_max should improve global energy at the cost of runtime"
