scenario_version = 1
id = "B1"
tier = 6
category = "qaoa_parameterization"
name = "QAOA depth sweep"
description = "N=4, K=2 reference workload. Sweeps QAOA depth p to estimate the smallest layer count where the gap stabilizes."

[workload]
mode = "preset"
num_processes = 4
num_cores = 2
weights = [0.15, 0.35, 0.25, 0.25]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 100
learning_rate = 0.05
top_k = 32
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 8
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 5

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "max_probability"]

[[sweep.axes]]
name = "layers"
path = "qaoa.layers"
values = [1, 2, 3, 4, 5, 6, 7]

[checks]
no_crash = true
expected_pipeline = "default"
global_optimum_available = true
qaoa_feasible = true
