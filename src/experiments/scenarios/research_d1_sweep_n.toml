scenario_version = 1
id = "D1"
tier = 6
category = "decomposition_scaling"
name = "Sweep N with fixed K and qubit_max"
description = "Generated uniform-total workloads with K=2 and qubit_max=6. N*K <= qubit_max uses DefaultPipeline; larger N uses IterativePipeline."

[workload]
mode = "generated"
num_processes = 2
num_cores = 2
weight_strategy = "uniform_total"
total_weight = 1.0

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 32
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5
init_strategy = "fixed"

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "auto"
solvers = ["qaoa", "brute_force"]
repeats = 5

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "num_sub_qubos", "load_imbalance", "annealing_gap"]

[[sweep.axes]]
name = "num_processes"
path = "workload.num_processes"
values = [2, 3, 4, 5, 6, 8, 10]

[checks]
no_crash = true
global_assignment_feasible = true

