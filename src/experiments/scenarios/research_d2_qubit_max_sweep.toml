scenario_version = 1
id = "D2"
tier = 6
category = "decomposition_scaling"
name = "Fixed N sweep qubit_max"
description = "N=8, K=2 workload. Sweeps qubit_max to trace the quality/runtime curve used in the hardware-budget argument."

[workload]
mode = "preset"
num_processes = 8
num_cores = 2
weights = [0.30, 0.27, 0.22, 0.18, 0.15, 0.11, 0.08, 0.05]

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 32
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "auto"
solvers = ["qaoa", "brute_force"]
repeats = 5

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "num_sub_qubos", "load_imbalance"]

[[sweep.axes]]
name = "qubit_max"
path = "decomposition.qubit_max"
values = [4, 6, 8, 10, 12, 16]

[checks]
no_crash = true
global_assignment_feasible = true
expected_trend = "larger qubit_max should not be assumed monotonic until measured."
