scenario_version = 1
id = "T2.2"
tier = 2
category = "correctness"
name = "Alpha metric sanity"
description = "QAOA, simulated annealing, and brute force should report gap-based alpha values inside [0, 1]."

[workload]
mode = "preset"
num_processes = 3
num_cores = 2
weights = [0.3, 0.4, 0.3]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "simulated_annealing", "brute_force"]
repeats = 1

[checks]
no_crash = true
alpha_min = 0.0
alpha_max = 1.0
flag_if_alpha_negative = true
flag_if_alpha_above_one = true
note = "The current repository has QAOA and brute force backends; simulated_annealing is included for runner support when available."
