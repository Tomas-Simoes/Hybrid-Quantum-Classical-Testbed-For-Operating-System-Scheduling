scenario_version = 1
id = "T1.3"
tier = 1
category = "smoke"
name = "Live trace, small core count"
description = "Capture live processes, force the virtual scheduling target to two cores, and cap sub-QUBOs at eight qubits."

[workload]
mode = "live_trace"
num_cores = 2
process_source = "system_snapshot"

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = true
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 8
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "auto"
solvers = ["qaoa"]
brute_force_policy = "skip_if_above_limit"
repeats = 1

[checks]
no_crash = true
global_assignment_feasible = true
assignment_printed = true
expected_messages = ["whatever processes get captured", "feasible assignment printed"]
