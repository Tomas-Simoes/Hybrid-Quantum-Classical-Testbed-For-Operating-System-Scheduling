scenario_version = 1
id = "T2.5"
tier = 2
category = "correctness"
name = "Three-core direct assignment"
description = "Four processes on three cores. Tests K > 2 variable mapping, decoding, brute-force validation, and visualization metadata."

[workload]
mode = "preset"
num_processes = 4
num_cores = 3
weights = [0.4, 0.25, 0.2, 0.15]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 60
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 12
num_cores = 3
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "WEIGHT_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "default"
three_core_mapping = true
brute_force_available = true
