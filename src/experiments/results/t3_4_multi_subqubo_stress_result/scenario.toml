scenario_version = 1
id = "T3.4"
tier = 3
category = "decomposition"
name = "Multi-sub-QUBO stress"
description = "Eight processes on two cores with qubit_max six should produce at least three sub-QUBOs and exercise phi propagation over multiple iterations."

[workload]
mode = "preset"
num_processes = 8
num_cores = 2
weights = [0.30, 0.27, 0.22, 0.18, 0.15, 0.11, 0.08, 0.05]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 16
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "iterative"
solvers = ["qaoa"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "iterative"
minimum_sub_qubos = 3
phi_history_required = true
