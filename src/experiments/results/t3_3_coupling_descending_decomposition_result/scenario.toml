scenario_version = 1
id = "T3.3"
tier = 3
category = "decomposition"
name = "Coupling-descending decomposition"
description = "Same six-process workload as T3.2, but with COUPLING_DESCENDING. Useful for comparing heuristic output and final global energy."

[workload]
mode = "preset"
num_processes = 6
num_cores = 2
weights = [0.42, 0.33, 0.28, 0.19, 0.12, 0.06]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 16
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "iterative"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "iterative"
partition_heuristic = "COUPLING_DESCENDING"
all_processes_covered = true
