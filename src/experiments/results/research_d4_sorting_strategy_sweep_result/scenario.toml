scenario_version = 1
id = "D4"
tier = 6
category = "decomposition_scaling"
name = "Decomposition sorting strategy sweep"
description = "N=8, K=2, qubit_max=6 workload. Compares implemented static partition heuristics; CORE_BALANCE is excluded because it is dynamic and not implemented."

[workload]
mode = "preset"
num_processes = 8
num_cores = 2
weights = [0.30, 0.27, 0.22, 0.18, 0.15, 0.11, 0.08, 0.05]

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 32
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5
init_strategy = "fixed"

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "auto"
solvers = ["qaoa", "brute_force"]
repeats = 5

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "num_sub_qubos", "load_imbalance"]

[[sweep.axes]]
name = "sorting_strategy"
path = "decomposition.sorting_strategy"
values = ["WEIGHT_DESCENDING", "COUPLING_DESCENDING"]

[checks]
no_crash = true
global_assignment_feasible = true

