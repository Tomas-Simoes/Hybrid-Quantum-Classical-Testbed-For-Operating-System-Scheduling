scenario_version = 1
id = "T1.4"
tier = 1
category = "smoke"
name = "Generated static workload direct path"
description = "Generated uniform workload with explicit num_processes. This verifies the runner's generated workload mode without using sweep expansion."

[workload]
mode = "generated"
num_processes = 4
num_cores = 2
weight_strategy = "uniform_total"
total_weight = 1.0

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 12
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 8
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "WEIGHT_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "default"
generated_workload_supported = true
