scenario_version = 1
id = "T3.3"
tier = 3
category = "decomposition"
name = "Iterative pipeline end-to-end"
description = "Six processes on two cores with qubit_max six should produce multiple sub-QUBOs and cover all processes in the final assignment."

[workload]
mode = "preset"
num_processes = 6
num_cores = 2
weights = [0.2, 0.3, 0.15, 0.35, 0.1, 0.4]

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "iterative"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
subqubo_results_non_empty = true
final_assignment_size = 6
global_assignment_feasible = true
all_processes_covered = true
