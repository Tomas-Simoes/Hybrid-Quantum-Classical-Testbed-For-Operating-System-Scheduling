scenario_version = 1
id = "T2.2"
tier = 2
category = "correctness"
name = "Optimality gap sanity"
description = "Balanced three-process workload where brute force should be available, letting the runner report candidate energy, global energy, and optimality gap."

[workload]
mode = "preset"
num_processes = 3
num_cores = 2
weights = [0.3, 0.4, 0.3]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "default"
alpha_min = 0.0
brute_force_available = true
