scenario_version = 1
id = "T4.1"
tier = 4
category = "scaling"
name = "Fixed K=2, sweep N"
description = "Thesis scaling sweep for direct QAOA behavior as process count grows at fixed two-core target."

[workload]
mode = "generated"
num_cores = 2
weight_strategy = "uniform_total"
total_weight = 1.0
weight_formula = "1.0 / N"

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 16
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 5

[[sweep.axes]]
name = "num_processes"
path = "workload.num_processes"
values = [2, 3, 4, 5, 6, 8]

[record]
metrics = ["qaoa_energy", "brute_force_energy", "alpha", "solve_time_ms"]

[checks]
no_crash = true
brute_force_feasible = true
expected_trend = "solve time grows and alpha may degrade as N grows"
