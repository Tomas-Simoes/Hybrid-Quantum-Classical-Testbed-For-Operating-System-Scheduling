scenario_version = 1
id = "T3.2"
tier = 3
category = "decomposition"
name = "Coupling preservation stress"
description = "Uniform weights plus an artificial process-pair same-core penalty check that off-diagonal terms survive sub-QUBO extraction."

[workload]
mode = "preset"
num_processes = 4
num_cores = 2
weights = [0.5, 0.5, 0.5, 0.5]

[qubo]
penalty = 5.0

[[qubo.extra_couplings]]
kind = "same_core_pair_penalty"
process_index_i = 0
process_index_j = 1
coefficient = 2.0
symmetrize = true
reason = "Discourage assigning processes 0 and 1 to the same core."

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "iterative"
solvers = ["qaoa", "brute_force"]
repeats = 1
requires_runner_support = ["qubo.extra_couplings", "debug.subqubo_matrix_print"]

[debug]
print_global_qubo = true
print_subqubo_before_extraction = true
print_subqubo_after_extraction = true
expected_first_bundle_contains_processes = [0, 1]

[checks]
no_crash = true
global_assignment_feasible = true
process_indices_0_and_1_different_cores = true
off_diagonal_terms_preserved = true
