scenario_version = 1
id = "T3.5"
tier = 3
category = "decomposition"
name = "Three-core iterative decomposition"
description = "Five processes on three cores with qubit_max nine. Tests iterative extraction and decoding when K > 2."

[workload]
mode = "preset"
num_processes = 5
num_cores = 3
weights = [0.36, 0.27, 0.22, 0.18, 0.12]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 9
num_cores = 3
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "WEIGHT_DESCENDING"

[execution]
pipeline = "iterative"
solvers = ["qaoa"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "iterative"
three_core_iterative_mapping = true
