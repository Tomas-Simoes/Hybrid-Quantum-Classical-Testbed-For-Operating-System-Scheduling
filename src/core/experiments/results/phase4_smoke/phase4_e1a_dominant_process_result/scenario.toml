scenario_version = 1
id = "E1a"
tier = 7
category = "phase4_adversarial"
name = "Adversarial dominant-process workloads"
description = "Five N=6 workloads with one dominant process, crossed with QAOA depth, top-k, and five random seeds."

[workload]
mode = "preset"
num_processes = 6
num_cores = 2
weights = [0.08, 0.08, 0.08, 0.08, 0.08, 0.60]

[qubo]
penalty = 5.0

[qaoa]
layers = 1
steps = 100
learning_rate = 0.1
top_k = 3
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5
init_strategy = "random"
random_seed = 101

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[validation]
always_run_annealing = true

[execution]
pipeline = "iterative"
visualization = false
repeats = 1

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "load_imbalance", "annealing_gap", "component_timings_ms"]

[[sweep.cases]]
name = "dominant_060"
values = { "workload.weights" = [0.08, 0.08, 0.08, 0.08, 0.08, 0.60], "metadata.structure" = "dominant", "metadata.dominant_weight" = 0.60, "metadata.instance" = "dom060" }

[[sweep.cases]]
name = "dominant_070"
values = { "workload.weights" = [0.06, 0.06, 0.06, 0.06, 0.06, 0.70], "metadata.structure" = "dominant", "metadata.dominant_weight" = 0.70, "metadata.instance" = "dom070" }

[[sweep.cases]]
name = "dominant_080"
values = { "workload.weights" = [0.04, 0.04, 0.04, 0.04, 0.04, 0.80], "metadata.structure" = "dominant", "metadata.dominant_weight" = 0.80, "metadata.instance" = "dom080" }

[[sweep.cases]]
name = "dominant_090"
values = { "workload.weights" = [0.02, 0.02, 0.02, 0.02, 0.02, 0.90], "metadata.structure" = "dominant", "metadata.dominant_weight" = 0.90, "metadata.instance" = "dom090" }

[[sweep.cases]]
name = "dominant_095"
values = { "workload.weights" = [0.01, 0.01, 0.01, 0.01, 0.01, 0.95], "metadata.structure" = "dominant", "metadata.dominant_weight" = 0.95, "metadata.instance" = "dom095" }

[[sweep.axes]]
name = "layers"
path = "qaoa.layers"
values = [1, 2]

[[sweep.axes]]
name = "top_k"
path = "qaoa.top_k"
values = [3, 10]

[[sweep.axes]]
name = "random_seed"
path = "qaoa.random_seed"
values = [101, 102, 103, 104, 105]
