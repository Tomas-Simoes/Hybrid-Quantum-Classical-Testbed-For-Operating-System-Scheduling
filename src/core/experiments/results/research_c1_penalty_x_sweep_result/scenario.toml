scenario_version = 1
id = "C1"
tier = 6
category = "penalty_calibration"
name = "Penalty sensitivity with X mixer"
description = "N=4, K=2 reference workload. Sweeps P around the safe-penalty heuristic under the non-conserving X mixer."

[workload]
mode = "preset"
num_processes = 4
num_cores = 2
weights = [0.15, 0.35, 0.25, 0.25]

[qubo]
penalty = 0.35
penalty_intent = "P_safe = 2 * max_weight * total_weight / K = 0.35 for this workload."

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 64
mixer_type = "x"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 8
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 5

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "max_probability"]

[[sweep.axes]]
name = "penalty"
path = "qubo.penalty"
values = [0.0875, 0.175, 0.35, 0.7, 1.4]

[checks]
no_crash = true
expected_pipeline = "default"
global_optimum_available = true
feasibility_reporting_required = true
