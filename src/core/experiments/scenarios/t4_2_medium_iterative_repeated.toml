scenario_version = 1
id = "T4.2"
tier = 4
category = "scaling"
name = "Medium iterative repeated comparison"
description = "Same six-process workload as T4.1 but forced through iterative decomposition. Compare global energy, load imbalance, and solve time against the direct baseline."

[workload]
mode = "preset"
num_processes = 6
num_cores = 2
weights = [0.2, 0.3, 0.15, 0.35, 0.1, 0.4]

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "iterative"
solvers = ["qaoa", "brute_force"]
repeats = 3

[record]
metrics = ["global_energy", "optimality_gap", "load_imbalance", "solve_time_ms", "num_sub_qubos"]

[checks]
no_crash = true
expected_pipeline = "iterative"
compare_against = "T4.1"
repeated_static_config = true
