scenario_version = 1
id = "T1.1"
tier = 1
category = "smoke"
name = "Minimal preset direct path"
description = "Two processes on two cores. Four QUBO variables. This is the fastest deterministic end-to-end default-pipeline sanity check."

[workload]
mode = "preset"
num_processes = 2
num_cores = 2
weights = [0.3, 0.7]

[qubo]
penalty = 5.0
p_critical_note = "approximately 0.5 for this workload"

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 4
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "default"
qaoa_feasible = true
brute_force_feasible = true
global_optimum_available = true
