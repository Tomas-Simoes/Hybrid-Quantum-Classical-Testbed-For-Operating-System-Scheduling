scenario_version = 1
id = "T4.1"
tier = 4
category = "scaling"
name = "Medium direct repeated baseline"
description = "Six-process direct run with qubit_max equal to 12. Repeats the same static configuration to collect repeated QAOA measurements without sweep expansion."

[workload]
mode = "preset"
num_processes = 6
num_cores = 2
weights = [0.2, 0.3, 0.15, 0.35, 0.1, 0.4]

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 12
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 3

[record]
metrics = ["energy", "optimality_gap", "solve_time_ms", "max_probability"]

[checks]
no_crash = true
expected_pipeline = "default"
repeated_static_config = true
