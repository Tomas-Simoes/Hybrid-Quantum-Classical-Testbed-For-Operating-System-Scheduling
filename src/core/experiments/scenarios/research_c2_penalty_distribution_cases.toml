scenario_version = 1
id = "C2"
tier = 6
category = "penalty_calibration"
name = "Penalty robustness across weight distributions"
description = "N=4, K=2. Ten uniform-like and ten skewed synthetic workloads, each evaluated with P_safe and 2*P_safe under the X mixer."

[workload]
mode = "preset"
num_processes = 4
num_cores = 2
weights = [0.25, 0.25, 0.25, 0.25]

[qubo]
penalty = 0.25
penalty_intent = "Each sweep case sets P_safe=max_weight because total_weight=1 and K=2."

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 16
mixer_type = "x"
init_gamma = 0.5
init_beta = 0.5
init_strategy = "fixed"

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 8
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 1

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "max_probability"]

