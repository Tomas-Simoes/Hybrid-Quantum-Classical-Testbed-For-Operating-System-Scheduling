scenario_version = 1
id = "T5.2"
tier = 5
category = "live"
name = "Live trace realistic load"
description = "Real system snapshot during external CPU-intensive activity for thesis-style evidence on realistic processes. Non-deterministic by design."

[workload]
mode = "live_trace"
num_cores = 4
process_source = "system_snapshot"

[pre_run]
operator_action = "Start a CPU-intensive workload such as a compile or benchmark before launching this scenario."

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.05
top_k = 20
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = true
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 10
num_cores = 4
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "auto"
solvers = ["qaoa"]
brute_force_policy = "skip_if_above_limit"
repeats = 1

[record]
metrics = ["global_energy", "global_feasibility_rate", "solve_time_ms", "num_processes_captured", "num_sub_qubos"]

[checks]
no_crash = true
non_deterministic_live_input = true
real_processes_captured = true
assignment_printed = true
