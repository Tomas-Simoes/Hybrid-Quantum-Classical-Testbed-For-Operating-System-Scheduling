scenario_version = 1
id = "E3U"
tier = 7
category = "phase4_top_k_generalization"
name = "Top-k generalization across uniform dimensions"
description = "Forced iterative pipeline for the seven D1 dimensions, four top-k values, and five random seeds."

[workload]
mode = "generated"
num_processes = 2
num_cores = 2
weight_strategy = "uniform_total"
total_weight = 1.0

[qubo]
penalty = 5.0

[qaoa]
layers = 2
steps = 100
learning_rate = 0.1
top_k = 1
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5
init_strategy = "random"
random_seed = 101

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[validation]
always_run_annealing = true

[execution]
pipeline = "iterative"
visualization = false
repeats = 1

[record]
metrics = ["energy", "optimality_gap", "feasible", "solve_time_ms", "load_imbalance", "component_timings_ms"]

[[sweep.axes]]
name = "num_processes"
path = "workload.num_processes"
values = [2, 3, 4, 5, 6, 8, 10]

[[sweep.axes]]
name = "top_k"
path = "qaoa.top_k"
values = [1, 3, 5, 10]

[[sweep.axes]]
name = "random_seed"
path = "qaoa.random_seed"
values = [101, 102, 103, 104, 105]
