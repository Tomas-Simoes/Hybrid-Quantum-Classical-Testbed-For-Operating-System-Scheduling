scenario_version = 1
id = "T2.1"
tier = 2
category = "correctness"
name = "Low-penalty ground truth diagnostic"
description = "Uses a deliberately low penalty to inspect feasible optimum vs unconstrained optimum reporting. This is a diagnostic, not a success-claim scenario."

[workload]
mode = "preset"
num_processes = 3
num_cores = 2
weights = [0.1, 0.8, 0.1]

[qubo]
penalty = 0.05
penalty_intent = "below_p_critical"

[qaoa]
layers = 1
steps = 50
learning_rate = 0.05
top_k = 10
mixer_type = "xy"
init_gamma = 0.5
init_beta = 0.5

[tracer]
live_mode = false
min_rss = 20.0
min_cpu = 0.005
cpu_interval = 1
num_samples = 3

[decomposition]
qubit_max = 6
num_cores = 2
io_alpha = 0.5
affinity_alpha = 0.8
homogeneity_threshold = 0.3
zscore_threshold = 1.5
sorting_strategy = "COUPLING_DESCENDING"

[execution]
pipeline = "default"
solvers = ["qaoa", "brute_force"]
repeats = 1

[checks]
no_crash = true
expected_pipeline = "default"
brute_force_feasible_optimum_reported = true
unconstrained_minimum_reported = true
inspect_unconstrained_is_feasible = true
